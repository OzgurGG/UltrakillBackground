name: Build & Release UltrakillBackground

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm install

      - name: Build Web Application
        working-directory: web
        run: npm run build

      - name: Compile C# Executable
        shell: cmd
        run: |
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe ^
            /target:winexe ^
            /out:csharp\UltrakillBackground.exe ^
            /reference:csharp\Microsoft.Web.WebView2.Core.dll,csharp\Microsoft.Web.WebView2.WinForms.dll,System.Windows.Forms.dll,System.Drawing.dll ^
            csharp\WallpaperApp.cs

      - name: Package Distribution Folder
        shell: powershell
        run: |
          $pkgDir = "ultrakillbackgroundapp"
          if (Test-Path $pkgDir) { Remove-Item -Recurse -Force $pkgDir }
          New-Item -ItemType Directory -Path $pkgDir | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir\dist" | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir\x64" | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir\runtimes\win-x64\native" -Force | Out-Null

          Copy-Item "csharp\UltrakillBackground.exe" "$pkgDir\"
          Copy-Item "csharp\Microsoft.Web.WebView2.Core.dll" "$pkgDir\"
          Copy-Item "csharp\Microsoft.Web.WebView2.WinForms.dll" "$pkgDir\"
          Copy-Item "csharp\WebView2Loader.dll" "$pkgDir\"
          Copy-Item "csharp\WebView2Loader.dll" "$pkgDir\x64\"
          Copy-Item "csharp\WebView2Loader.dll" "$pkgDir\runtimes\win-x64\native\"

          if (Test-Path "ultrakill-config.json") {
            Copy-Item "ultrakill-config.json" "$pkgDir\"
          }

          Copy-Item -Recurse -Force "web\dist\*" "$pkgDir\dist\"

          # README dosyasini ekle
          @'
          ========================================================================
            ULTRAKILL DYNAMIC DESKTOP WALLPAPER (V1 CRT VISUALIZER)
          ========================================================================

          KULLANIM:
          1. "UltrakillBackground.exe" dosyasina cift tiklayarak baslatin.
          2. Uygulama otomatik olarak masaustu arka planiniza yerlesir.
          3. Sag alttaki sistem tepsisindeki (Windows Tray) simgesine sag tiklayarak
             "Ayarlar (Settings)..." penceresini acabilir veya cikis yapabilirsiniz.

          GEREKSINIMLER:
          - Windows 10 (64-bit) veya Windows 11.
          - Edge WebView2 Runtime (Windows 10/11'de otomatik olarak kuruludur).
          ========================================================================
          '@ | Set-Content -Path "$pkgDir\README.txt" -Encoding UTF8

          # ZIP arsivini olustur
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $zipName = "UltrakillBackground-$tag.zip"
          Compress-Archive -Path "$pkgDir\*" -DestinationPath $zipName -Force
          Write-Host "Created archive: $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: UltrakillBackground-*.zip
          name: Release ${{ github.ref_name || 'v1.0.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
